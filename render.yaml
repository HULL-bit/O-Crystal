# Blueprint de déploiement Render — O'Crystal
# Un service web Node (Next.js + Payload embarqué) + une base Postgres managée.
# Cloudflare devant pour CDN / cache / WAF / anti-DDoS.
# Docs : https://render.com/docs/blueprint-spec

services:
  - type: web
    name: ocrystal-web
    runtime: node
    plan: standard
    region: frankfurt
    # Node 20.9+ requis par Next 16
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /fr
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: PAYLOAD_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: DATABASE_URI
        fromDatabase:
          name: ocrystal-db
          property: connectionString
      # Schéma DB : synchro auto (drizzle push). Instance unique Render =
      # acceptable. Poser "false" une fois des migrations versionnées créées
      # (cf. docs/DEPLOY.md).
      - key: PAYLOAD_DB_PUSH
        value: "true"
      # Scène 3D temps réel désactivée par défaut (perf 4G / Chromebook).
      - key: NEXT_PUBLIC_ENABLE_3D
        value: "false"

      # --- Médias : Cloudflare R2 (compatible S3) — dashboard ---
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_URL
        sync: false

      # --- Formulaires / e-mail ---
      - key: MAIL_FROM
        value: O'Crystal <no-reply@ocrystal.sn>
      - key: CONTACT_INBOX
        value: contact@ocrystal.sn
      - key: RESEND_API_KEY
        sync: false
      - key: HCAPTCHA_SECRET
        sync: false
      - key: NEXT_PUBLIC_HCAPTCHA_SITE_KEY
        sync: false

      # --- Carte ---
      - key: NEXT_PUBLIC_MAP_STYLE_URL
        value: https://tiles.openfreemap.org/styles/liberty

      # --- Mesure d'audience (Plausible, après consentement) ---
      - key: NEXT_PUBLIC_PLAUSIBLE_DOMAIN
        value: ocrystal.sn

      # --- Monitoring (Sentry) — laisser vide = désactivé ---
      - key: SENTRY_DSN
        sync: false
      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false

  # Publication programmée : traite la file de jobs Payload toutes les 5 min.
  - type: cron
    name: ocrystal-scheduled-publish
    runtime: node
    schedule: "*/5 * * * *"
    buildCommand: "true"
    startCommand: >
      curl -fsS -X POST "$WEB_URL/api/payload-jobs/run"
      -H "Authorization: Bearer $CRON_SECRET"
    envVars:
      - key: WEB_URL
        fromService:
          name: ocrystal-web
          type: web
          property: hostport
      - key: CRON_SECRET
        fromService:
          name: ocrystal-web
          type: web
          envVarKey: CRON_SECRET

databases:
  - name: ocrystal-db
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "16"
