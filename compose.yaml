# ------------------------------------------------------------------
# O'Crystal — pile complète en un seul conteneur d'orchestration.
#
#   docker compose up --build        # tout construire + démarrer
#   → site : http://localhost:3000   ·   admin : http://localhost:3000/admin
#
# Prérequis : un fichier .env.local à la racine (au moins PAYLOAD_SECRET et
# CRON_SECRET ; + les clés R2 pour le stockage des médias). Copier .env.example.
# Le schéma de base est créé automatiquement au 1er démarrage.
#
# Variables surchargeables (fichier .env à la racine ou shell) :
#   WEB_PORT (défaut 3000) — si 3000 est déjà pris : WEB_PORT=3001 docker compose up
#   DB_PORT  (défaut 5433) — accès Postgres depuis l'hôte
#   SITE_URL, ENABLE_3D, HCAPTCHA_SITE_KEY, PLAUSIBLE_DOMAIN, SENTRY_DSN_PUBLIC (build)
# ------------------------------------------------------------------

services:
  db:
    image: docker.io/library/postgres:16-alpine
    container_name: ocrystal-pg
    environment:
      POSTGRES_USER: ocrystal
      POSTGRES_PASSWORD: ocrystal
      POSTGRES_DB: ocrystal
    ports:
      - "${DB_PORT:-5433}:5432" # accès Postgres depuis l'hôte (outils, next dev)
    volumes:
      - ocrystal-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ocrystal"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_ENABLE_3D: ${ENABLE_3D:-false}
        NEXT_PUBLIC_HCAPTCHA_SITE_KEY: ${HCAPTCHA_SITE_KEY:-}
        NEXT_PUBLIC_PLAUSIBLE_DOMAIN: ${PLAUSIBLE_DOMAIN:-}
        NEXT_PUBLIC_SENTRY_DSN: ${SENTRY_DSN_PUBLIC:-}
    image: ocrystal-web:local
    container_name: ocrystal-web
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env.local
        required: false
    environment:
      NODE_ENV: production
      # Réseau interne compose — écrase la valeur host de .env.local.
      DATABASE_URI: postgres://ocrystal:ocrystal@db:5432/ocrystal
      # Le schéma est appliqué au 1er démarrage par docker/entrypoint.sh
      # (docker/schema.sql) : une build de prod fige le push de Payload.
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      # Repli si R2 non configuré : les médias uploadés survivent aux redémarrages.
      - ocrystal-media:/app/media
    restart: unless-stopped

volumes:
  ocrystal-pgdata:
  ocrystal-media:
